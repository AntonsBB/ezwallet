[package]
name = "easy-wallet-contracts"
description = "Auditable non-custodial escrow contracts for Easy Wallet"
version = "0.1.0"
license = "MIT"

[toolchain]
acton = "1.1.0"

[contracts.EasyWalletEscrow]
display-name = "Easy Wallet Escrow"
