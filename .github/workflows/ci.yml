name: CI

on:
  push:
    branches: ["main", "codex/**"]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.14.0
          cache: npm
      - run: npm install --global npm@11.6.2
      - run: npm ci
      - run: npm run test:unit
      - run: npm run lint
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=high
